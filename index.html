<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPOS - Premium Point of Sale</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dexie.js for IndexedDB -->
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        primaryHover: '#4f46e5',
                        accent: '#f43f5e',
                        dark: '#020617',
                        darkLighter: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-slate-200 font-sans h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-white">

    <!-- Navbar -->
    <header class="h-16 bg-darkLighter/80 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-6 z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-xl flex items-center justify-center shadow-lg shadow-primary/30">
                <i class="fas fa-cube text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">NexPOS <span class="text-primary text-sm tracking-normal font-medium bg-primary/10 px-2 py-0.5 rounded-full ml-2 border border-primary/20">PRO</span></h1>
        </div>
        
        <div class="flex items-center bg-cardBg rounded-full px-4 py-2 border border-slate-700 w-1/3 max-w-md focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-inner">
            <i class="fas fa-search text-slate-400"></i>
            <input type="text" id="search-input" placeholder="Search by SKU, barcode, or name..." class="bg-transparent border-none outline-none text-sm ml-3 w-full placeholder-slate-500 text-white">
        </div>

        <div class="flex items-center space-x-6">
            <div class="text-right hidden md:block">
                <div class="text-sm font-semibold text-white tracking-wide" id="clock">--:-- --</div>
                <div class="text-xs text-slate-400" id="date">---</div>
            </div>
            <div class="h-8 w-[1px] bg-slate-700"></div>
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 border-2 border-slate-700 overflow-hidden cursor-pointer hover:border-primary transition-colors shadow-md">
                    <img src="https://i.pravatar.cc/150?img=11" alt="User" class="w-full h-full object-cover">
                </div>
                <div class="hidden sm:block cursor-pointer group">
                    <p class="text-sm font-medium text-white group-hover:text-primary transition-colors">Sahan</p>
                    <p class="text-xs text-slate-400 flex items-center"><span class="w-2 h-2 rounded-full bg-green-500 mr-1.5 shadow-[0_0_5px_#22c55e]"></span>Manager</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-20 lg:w-64 bg-darkLighter border-r border-slate-800 flex flex-col justify-between shrink-0 transition-all duration-300 z-10 shadow-[10px_0_30px_rgba(0,0,0,0.1)]">
            <nav class="p-4 space-y-2 mt-2">
                <a href="#" class="flex items-center space-x-4 px-4 py-3 bg-primary/10 text-primary rounded-xl relative group border border-primary/20 shadow-sm">
                    <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-8 bg-primary rounded-r-md shadow-[0_0_10px_#6366f1]"></div>
                    <i class="fas fa-th-large text-lg w-6 text-center group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium hidden lg:block tracking-wide">Point of Sale</span>
                </a>
                <a href="#" class="flex items-center space-x-4 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-colors group">
                    <i class="fas fa-box-open text-lg w-6 text-center group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium hidden lg:block tracking-wide">Inventory</span>
                </a>
                <a href="#" class="flex items-center space-x-4 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-colors group">
                    <i class="fas fa-users text-lg w-6 text-center group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium hidden lg:block tracking-wide">Customers</span>
                </a>
                <a href="#" class="flex items-center space-x-4 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-colors group">
                    <i class="fas fa-chart-pie text-lg w-6 text-center group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium hidden lg:block tracking-wide">Reports</span>
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800/50">
                <a href="#" class="flex items-center space-x-4 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-colors group">
                    <i class="fas fa-cog text-lg w-6 text-center group-hover:rotate-90 transition-transform duration-300"></i>
                    <span class="font-medium hidden lg:block tracking-wide">Settings</span>
                </a>
            </div>
        </aside>

        <!-- Center: Products -->
        <section class="flex-1 flex flex-col bg-dark overflow-hidden relative">
            <!-- Background Decoration -->
            <div class="absolute top-0 left-0 w-full h-[500px] bg-gradient-to-b from-primary/10 via-darkLighter/5 to-transparent pointer-events-none"></div>
            
            <div class="p-6 pb-4 shrink-0 z-10 flex space-x-3 overflow-x-auto no-scrollbar" id="category-filters">
                <!-- Categories injected by JS -->
            </div>

            <!-- Products Grid -->
            <div class="flex-1 overflow-y-auto p-6 pt-0 custom-scrollbar z-10">
                <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6 auto-rows-max">
                    <!-- Products injected here via JS -->
                </div>
            </div>
        </section>

        <!-- Right: Cart -->
        <aside class="w-96 bg-darkLighter border-l border-slate-800 flex flex-col shrink-0 shadow-[-10px_0_30px_rgba(0,0,0,0.2)] z-20 relative">
            
            <!-- Cart Header -->
            <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-darkLighter/90 backdrop-blur-md">
                <h2 class="text-lg font-semibold text-white flex items-center tracking-wide"><i class="fas fa-shopping-bag mr-3 text-primary"></i> Current Order</h2>
                <button class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 text-slate-400 hover:text-accent hover:border-accent/50 hover:bg-accent/10 flex items-center justify-center transition-all" title="Clear Cart" onclick="clearCart()">
                    <i class="fas fa-trash-alt text-sm"></i>
                </button>
            </div>

            <!-- Customer Select -->
            <div class="p-4 border-b border-slate-800/50 bg-slate-900/30">
                <button class="w-full bg-cardBg border border-slate-700 hover:border-primary/50 hover:bg-slate-800 text-slate-300 py-3 rounded-xl flex items-center justify-between px-4 transition-all group shadow-sm">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-primary/20 text-primary flex items-center justify-center mr-3">
                            <i class="fas fa-user text-sm"></i>
                        </div>
                        <span class="font-medium">Walk-in Customer</span>
                    </div>
                    <i class="fas fa-chevron-right text-xs text-slate-600 group-hover:text-primary transition-colors"></i>
                </button>
            </div>

            <!-- Cart Items List -->
            <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar" id="cart-items">
                <!-- Items injected here -->
            </div>

            <!-- Totals & Checkout -->
            <div class="p-6 border-t border-slate-800 bg-darkLighter shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
                <div class="space-y-3 mb-6">
                    <div class="flex justify-between text-slate-400 text-sm">
                        <span>Subtotal</span>
                        <span id="subtotal" class="font-medium text-white">Rs. 0.00</span>
                    </div>
                    <div class="flex justify-between text-slate-400 text-sm">
                        <span>Discount</span>
                        <span class="font-medium text-accent">- Rs. 0.00</span>
                    </div>
                    <div class="flex justify-between text-slate-400 text-sm">
                        <span>Tax (5%)</span>
                        <span id="tax" class="font-medium text-white">Rs. 0.00</span>
                    </div>
                    <div class="h-px w-full bg-slate-700 my-3 border-dashed border-t border-slate-700"></div>
                    <div class="flex justify-between items-end">
                        <span class="text-slate-300 text-lg font-medium">Total</span>
                        <span id="total" class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 tracking-tight">Rs. 0.00</span>
                    </div>
                </div>

                <button onclick="checkout()" class="w-full bg-gradient-to-r from-primary to-primaryHover text-white py-4 rounded-xl font-bold text-lg shadow-[0_10px_20px_rgba(99,102,241,0.3)] hover:shadow-[0_15px_25px_rgba(99,102,241,0.4)] hover:-translate-y-1 transition-all active:translate-y-0 active:shadow-none relative overflow-hidden group flex items-center justify-center">
                    <div class="absolute inset-0 w-full h-full bg-white/20 scale-x-0 group-hover:scale-x-100 origin-left transition-transform duration-300 ease-out z-0"></div>
                    <span class="relative z-10 flex items-center">
                        <i class="fas fa-credit-card mr-2"></i> Pay Now
                    </span>
                    <i class="fas fa-arrow-right ml-2 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 relative z-10"></i>
                </button>
            </div>

        </aside>

    </main>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
